<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar menú - SIAR</title>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">SIAR - Administrar menú</span>

            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-light btn-sm" href="menu.html">Menú</a>
                <a class="btn btn-outline-light btn-sm" href="admin-menu.html">Administrar menú</a>
                <a class="btn btn-outline-light btn-sm" href="usuarios.html">Usuarios</a>
                <a class="btn btn-outline-light btn-sm" href="facturacion.html">Facturación</a>
                <a class="btn btn-outline-light btn-sm" href="reportes.html">Reportes</a>
            </div>
        </div>
    </nav>

    <div class="container">

        <div id="alerta" class="alert d-none" role="alert"></div>

        <div class="row g-4">

            <!-- CATEGORÍAS -->
            <div class="col-lg-4">

                <h2 class="h5">Categorías</h2>

                <div class="input-group mb-2">
                    <input type="hidden" id="cId">

                    <input
                        type="text"
                        id="cNombre"
                        class="form-control"
                        placeholder="Nombre de la categoría">

                    <button class="btn btn-primary" onclick="guardarCategoria()">
                        Guardar
                    </button>
                </div>

                <ul id="listaCategorias" class="list-group"></ul>

            </div>

            <!-- PRODUCTOS -->
            <div class="col-lg-8">

                <h2 class="h5">Productos</h2>

                <div class="row g-2 mb-3">

                    <input type="hidden" id="pId">

                    <div class="col-md-6">
                        <input
                            type="text"
                            id="pNombre"
                            class="form-control"
                            placeholder="Nombre del producto">
                    </div>

                    <div class="col-md-3">
                        <input
                            type="number"
                            id="pPrecio"
                            class="form-control"
                            placeholder="Precio"
                            min="1">
                    </div>

                    <div class="col-md-3">
                        <select id="pCategoria" class="form-select">
                            <option value="">Categoría</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <input
                            type="text"
                            id="pDescripcion"
                            class="form-control"
                            placeholder="Descripción o ingredientes">
                    </div>

                    <div class="col-md-6">
                        <input
                            type="text"
                            id="pImagen"
                            class="form-control"
                            placeholder="URL de imagen (opcional)">
                    </div>

                    <div class="col-12">
                        <button class="btn btn-primary" onclick="guardarProducto()">
                            Guardar producto
                        </button>

                        <button class="btn btn-outline-secondary" onclick="limpiarProducto()">
                            Cancelar
                        </button>
                    </div>

                </div>

                <!-- TABLA -->
                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Disponible</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaProductos"></tbody>

                    </table>

                </div>

            </div>

        </div>
    </div>

    <script src="menu-data.js"></script>

    <script>

        const $ = id => document.getElementById(id);

        const esc = texto => String(texto ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[c]));

        const dinero = valor =>
            "$" + Number(valor).toLocaleString("es-CO");

        let categoriasActuales = [];
        let productosActuales = [];

        // Mostrar mensajes
        function aviso(texto, bien = true) {
            const alerta = $("alerta");

            alerta.className = "alert alert-" + (bien ? "success" : "danger");
            alerta.textContent = texto;
        }

        function ocultarAviso() {
            $("alerta").classList.add("d-none");
        }

        // Ejecutar una operación y actualizar la pantalla
        async function ejecutar(operacion, mensaje) {
            try {
                await operacion();
                aviso(mensaje);
                await render();
                return true;

            } catch (error) {
                aviso(error.message, false);
                return false;
            }
        }

        // Dibujar toda la pantalla
        async function render() {
            try {
                const [categorias, productos] = await Promise.all([
                    MenuData.categorias(),
                    MenuData.productos()
                ]);

                categoriasActuales = categorias;
                productosActuales = productos;

                // Lista de categorías
                $("listaCategorias").innerHTML = categorias.map(c => `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        ${esc(c.nombre)}

                        <span>
                            <button
                                class="btn btn-sm btn-outline-secondary"
                                onclick="editarCategoria(${c.id})">
                                Editar
                            </button>

                            <button
                                class="btn btn-sm btn-outline-danger"
                                onclick="borrarCategoria(${c.id})">
                                Eliminar
                            </button>
                        </span>
                    </li>
                `).join("");

                // Desplegable de categorías
                const actual = $("pCategoria").value;

                $("pCategoria").innerHTML =
                    '<option value="">Categoría</option>' +
                    categorias.map(c => `
                        <option value="${c.id}">
                            ${esc(c.nombre)}
                        </option>
                    `).join("");

                if (categorias.some(c => String(c.id) === actual)) {
                    $("pCategoria").value = actual;
                }

                // Tabla de productos
                $("tablaProductos").innerHTML = productos.map(p => {

                    const categoria = categorias.find(
                        c => Number(c.id) === Number(p.categoriaId)
                    );

                    const disponible = Number(p.disponible) === 1;

                    return `
                        <tr>
                            <td>${esc(p.nombre)}</td>

                            <td>
                                ${categoria ? esc(categoria.nombre) : "-"}
                            </td>

                            <td>${dinero(p.precio)}</td>

                            <td>
                                <div class="form-check form-switch">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        ${disponible ? "checked" : ""}
                                        onchange="alternar(${p.id})">
                                </div>

                                <small>
                                    ${disponible ? "Disponible" : "Agotado"}
                                </small>
                            </td>

                            <td class="text-end">
                                <button
                                    class="btn btn-sm btn-outline-secondary"
                                    onclick="editarProducto(${p.id})">
                                    Editar
                                </button>

                                <button
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="darDeBaja(${p.id})">
                                    Eliminar
                                </button>
                            </td>
                        </tr>
                    `;
                }).join("");

            } catch (error) {
                aviso(error.message, false);
            }
        }

        // =========================
        // CATEGORÍAS
        // =========================

        async function guardarCategoria() {
            const id = Number($("cId").value) || undefined;

            const correcto = await ejecutar(
                () => MenuData.guardarCategoria({
                    id,
                    nombre: $("cNombre").value
                }),
                "Categoría guardada correctamente."
            );

            if (correcto) {
                $("cId").value = "";
                $("cNombre").value = "";
            }
        }

        function editarCategoria(id) {
            const categoria = categoriasActuales.find(c => c.id === id);

            if (!categoria) return;

            $("cId").value = categoria.id;
            $("cNombre").value = categoria.nombre;
        }

        async function borrarCategoria(id) {
            if (!confirm("¿Desea dar de baja esta categoría?")) return;

            await ejecutar(
                () => MenuData.eliminarCategoria(id),
                "Categoría dada de baja."
            );
        }

        // =========================
        // PRODUCTOS
        // =========================

        async function guardarProducto() {
            const producto = {
                id: Number($("pId").value) || undefined,
                nombre: $("pNombre").value,
                precio: $("pPrecio").value,
                categoriaId: Number($("pCategoria").value),
                descripcion: $("pDescripcion").value,
                imagen: $("pImagen").value
            };

            const correcto = await ejecutar(
                () => MenuData.guardarProducto(producto),
                "Producto guardado correctamente."
            );

            if (correcto) {
                limpiarProducto();
            }
        }

        function editarProducto(id) {
            const producto = productosActuales.find(p => p.id === id);

            if (!producto) return;

            $("pId").value = producto.id;
            $("pNombre").value = producto.nombre;
            $("pPrecio").value = producto.precio;
            $("pCategoria").value = producto.categoriaId;
            $("pDescripcion").value = producto.descripcion || "";
            $("pImagen").value = producto.imagen || "";
        }

        function limpiarProducto() {
            [
                "pId",
                "pNombre",
                "pPrecio",
                "pCategoria",
                "pDescripcion",
                "pImagen"
            ].forEach(id => {
                $(id).value = "";
            });
        }

        async function darDeBaja(id) {
            if (!confirm("¿Dar de baja este producto?")) return;

            await ejecutar(
                () => MenuData.bajaProducto(id),
                "Producto dado de baja."
            );
        }

        async function alternar(id) {
            await ejecutar(
                () => MenuData.alternarDisponible(id),
                "Disponibilidad actualizada."
            );
        }

        // Cargar pantalla
        render();

    </script>

</body>
</html>
