<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - SIAR</title>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <!-- NAVEGACIÓN -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">

            <span class="navbar-brand">SIAR - Menú</span>

            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-light btn-sm" href="menu.html">Menú</a>
                <a class="btn btn-outline-light btn-sm" href="admin-menu.html">Administrar menú</a>
                <a class="btn btn-outline-light btn-sm" href="usuarios.html">Usuarios</a>
                <a class="btn btn-outline-light btn-sm" href="facturacion.html">Facturación</a>
                <a class="btn btn-outline-light btn-sm" href="reportes.html">Reportes</a>
            </div>

        </div>
    </nav>

    <!-- CONTENIDO -->
    <main class="container">

        <h1 class="mb-4">Nuestro menú</h1>

        <div id="menu">
            <p>Cargando menú...</p>
        </div>

    </main>

    <script src="menu-data.js"></script>

    <script>

        // Escapar caracteres especiales
        const esc = texto => String(texto ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[c]));

        // Formato de pesos colombianos
        const dinero = valor =>
            "$" + Number(valor).toLocaleString("es-CO");

        // Cargar menú desde la API
        async function cargarMenu() {
            const contenedor = document.getElementById("menu");

            try {

                const [categorias, productos] = await Promise.all([
                    MenuData.categorias(),
                    MenuData.productos()
                ]);

                let html = "";

                categorias.forEach(categoria => {

                    const items = productos.filter(
                        p => Number(p.categoriaId) === Number(categoria.id)
                    );

                    if (items.length === 0) return;

                    html += `
                        <section class="mb-4">

                            <h2 class="h4 mb-3">
                                ${esc(categoria.nombre)}
                            </h2>

                            <div class="list-group">
                    `;

                    items.forEach(producto => {

                        const disponible =
                            Number(producto.disponible) === 1;

                        html += `
                            <div class="list-group-item
                                d-flex justify-content-between align-items-center
                                ${disponible ? "" : "text-muted"}">

                                <div>

                                    <strong>
                                        ${esc(producto.nombre)}
                                    </strong>

                                    ${
                                        disponible
                                            ? ""
                                            : '<span class="badge bg-secondary ms-2">Agotado</span>'
                                    }

                                    <div class="small">
                                        ${esc(producto.descripcion || "")}
                                    </div>

                                </div>

                                <span class="fw-bold">
                                    ${dinero(producto.precio)}
                                </span>

                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </section>
                    `;
                });

                contenedor.innerHTML =
                    html || "<p>No hay productos registrados en el menú.</p>";

            } catch (error) {

                contenedor.innerHTML = `
                    <div class="alert alert-danger">
                        ${esc(error.message)}
                    </div>
                `;
            }
        }

        cargarMenu();

    </script>

</body>
</html>
